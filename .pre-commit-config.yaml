repos:
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt
        language: system
        types: [shell]
        args: [--write, --indent, "2"]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: prettier
        name: prettier
        entry: prettier
        language: system
        files: \.(json|jsonc|md)$
        args: [--write]

      - id: markdownlint
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]

      - id: taplo
        name: taplo
        entry: taplo fmt
        language: system
        types: [toml]
